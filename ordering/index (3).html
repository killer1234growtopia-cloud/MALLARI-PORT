<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Order | Simple Ordering System</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#231f1a;--muted:#6b645b;--line:#e6dfd3;--accent:#c2410c;--accent-d:#9a3412;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--card:#201d1a;--text:#f3eee6;--muted:#a69d90;--line:#37322c;--accent:#fb923c;--accent-d:#f97316;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{padding:22px 16px 10px;max-width:1000px;margin:0 auto}
header h1{margin:0;font-size:1.7rem}
header p{margin:4px 0 0;color:var(--muted)}
.back{display:inline-block;margin-bottom:10px;color:var(--accent);text-decoration:none;font-size:.95rem}
.back:hover{text-decoration:underline}
main{max-width:1000px;margin:0 auto;padding:10px 16px 60px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
h2{font-size:1.15rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.item .emoji{font-size:2rem;line-height:1}
.item b{font-size:1rem}
.item .desc{color:var(--muted);font-size:.85rem;flex:1}
.item .price{font-weight:700}
button.add,button.primary,button.ghost{font:inherit;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--accent)}
button.add,button.primary{background:var(--accent);color:#fff}
button.add:hover,button.primary:hover{background:var(--accent-d)}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cart{position:sticky;top:12px}
.empty{color:var(--muted);padding:10px 0}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:600}
.line .sub{color:var(--muted);font-size:.85rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:1rem}
.rm{background:none;border:none;color:var(--bad);cursor:pointer;font:inherit;font-size:.85rem;padding:0}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;padding:12px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.receipt{border:2px dashed var(--line);border-radius:12px;padding:14px;margin-top:12px}
.receipt h3{margin:0 0 6px}
.receipt .ok{color:var(--ok);font-weight:700}
.receipt table{width:100%;border-collapse:collapse;margin:8px 0}
.receipt td{padding:3px 0}
.receipt td:last-child{text-align:right}
.orders{max-width:1000px;margin:0 auto;padding:0 16px 60px}
.orders table{width:100%;border-collapse:collapse;font-size:.92rem}
.orders th,.orders td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.orders th{color:var(--muted);font-weight:600}
.tbl{overflow-x:auto}
.status{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;border:1px solid var(--line)}
.s-Pending{color:#b45309}.s-Preparing{color:#1d4ed8}.s-Ready{color:var(--ok)}.s-Completed{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}
@media print{header,.menu-col,form,.orders,.toast,.cart>*:not(#receipt){display:none!important}}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html#projects">&larr; Back to portfolio</a>
  <h1>&#127857; Quick Order</h1>
  <p>Pick your items, add them to the cart, and place your order. A simple ordering system by Fritz Gerard Mallari.</p>
</header>

<main>
  <section class="card menu-col" aria-labelledby="mh">
    <h2 id="mh">Menu</h2>
    <div class="tabs" id="tabs" role="group" aria-label="Menu categories"></div>
    <div class="menu" id="menu"></div>
  </section>

  <aside class="card cart" aria-labelledby="ch">
    <h2 id="ch">Your order</h2>
    <div id="cartList"></div>
    <div class="total"><span>Total</span><span id="total">&#8369;0</span></div>

    <form id="orderForm" novalidate>
      <label for="cname">Your name</label>
      <input id="cname" type="text" maxlength="40" autocomplete="name" placeholder="Juan Dela Cruz">
      <div class="row">
        <div>
          <label for="otype">Order type</label>
          <select id="otype"><option>Dine in</option><option>Take out</option><option>Delivery</option></select>
        </div>
        <div>
          <label for="pay">Payment</label>
          <select id="pay"><option>Cash</option><option>GCash</option></select>
        </div>
      </div>
      <div id="addrBox" hidden>
        <label for="addr">Delivery address</label>
        <input id="addr" type="text" maxlength="120" placeholder="House no., street, barangay">
      </div>
      <label for="note">Note (optional)</label>
      <textarea id="note" rows="2" maxlength="120" placeholder="Less sugar, no onions, etc."></textarea>
      <p class="err" id="err" role="alert"></p>
      <div class="row">
        <button class="primary" type="submit" id="place">Place order</button>
        <button class="ghost" type="button" id="clearCart">Clear cart</button>
      </div>
    </form>
    <div id="receipt" aria-live="polite"></div>
  </aside>
</main>

<section class="orders" aria-labelledby="oh">
  <div class="card">
    <h2 id="oh">Order history (this browser)</h2>
    <p class="note">Orders are saved only in this browser. This is a demo, so no real payment or delivery happens.</p>
    <div class="tbl" id="history"></div>
    <div class="row" style="margin-top:12px;max-width:260px"><button class="ghost" type="button" id="clearAll">Delete all orders</button></div>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';

// ---- Menu data: edit names, prices and categories here ----
var MENU = [
  {id:1, cat:'Meals',  name:'Chicken Adobo Rice', price:95,  icon:'🍗', desc:'Chicken adobo with garlic rice'},
  {id:2, cat:'Meals',  name:'Pork Sisig',         price:110, icon:'🥘', desc:'Sizzling pork sisig with rice'},
  {id:3, cat:'Meals',  name:'Spaghetti',          price:80,  icon:'🍝', desc:'Sweet Filipino-style spaghetti'},
  {id:4, cat:'Snacks', name:'Burger',             price:70,  icon:'🍔', desc:'Beef patty with cheese'},
  {id:5, cat:'Snacks', name:'French Fries',       price:55,  icon:'🍟', desc:'Crispy fries, large'},
  {id:6, cat:'Snacks', name:'Siomai (4 pcs)',     price:45,  icon:'🥟', desc:'Steamed pork siomai'},
  {id:7, cat:'Drinks', name:'Iced Coffee',        price:65,  icon:'☕', desc:'Cold brew with milk'},
  {id:8, cat:'Drinks', name:'Milk Tea',           price:75,  icon:'🧋', desc:'Classic milk tea with pearls'},
  {id:9, cat:'Drinks', name:'Bottled Water',      price:20,  icon:'💧', desc:'500 ml'}
];
var CATS = ['All','Meals','Snacks','Drinks'];
var STATUSES = ['Pending','Preparing','Ready','Completed'];

// ---- Helpers ----
function $(id){ return document.getElementById(id); }
function money(n){ return '\u20B1' + n.toLocaleString('en-PH'); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
var toastEl = $('toast'), toastT;
function say(t){ toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800); }
function find(id){ return MENU.filter(function(m){ return m.id === id; })[0]; }

// ---- State ----
var cart = load('qo_cart', {});      // { itemId: quantity }
var orders = load('qo_orders', []);  // saved orders
var cat = 'All';

// ---- Menu ----
function drawTabs(){
  $('tabs').innerHTML = CATS.map(function(c){
    return '<button type="button" data-c="' + c + '" class="' + (c === cat ? 'on' : '') + '" aria-pressed="' + (c === cat) + '">' + c + '</button>';
  }).join('');
}
function drawMenu(){
  $('menu').innerHTML = MENU.filter(function(m){ return cat === 'All' || m.cat === cat; }).map(function(m){
    return '<div class="item"><span class="emoji" aria-hidden="true">' + m.icon + '</span><b>' + esc(m.name) + '</b><span class="desc">' + esc(m.desc) + '</span><span class="price">' + money(m.price) + '</span><button class="add" type="button" data-id="' + m.id + '" aria-label="Add ' + esc(m.name) + ' to cart">Add to cart</button></div>';
  }).join('');
}
$('tabs').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; cat = b.dataset.c; drawTabs(); drawMenu(); });
$('menu').addEventListener('click', function(e){
  var b = e.target.closest('.add'); if(!b) return;
  var id = b.dataset.id; cart[id] = Math.min((cart[id] || 0) + 1, 20);
  save('qo_cart', cart); drawCart(); say('Added ' + find(+id).name);
});

// ---- Cart ----
function cartTotal(){ return Object.keys(cart).reduce(function(s, id){ return s + find(+id).price * cart[id]; }, 0); }
function drawCart(){
  var ids = Object.keys(cart);
  $('place').disabled = !ids.length;
  $('total').textContent = money(cartTotal());
  if(!ids.length){ $('cartList').innerHTML = '<p class="empty">Your cart is empty. Add something from the menu.</p>'; return; }
  $('cartList').innerHTML = ids.map(function(id){
    var m = find(+id), q = cart[id];
    return '<div class="line"><div><div class="nm">' + esc(m.name) + '</div><div class="sub">' + money(m.price) + ' each</div></div><div style="text-align:right"><b>' + money(m.price * q) + '</b></div>' +
      '<div class="qty"><button type="button" data-a="dec" data-id="' + id + '" aria-label="Less ' + esc(m.name) + '">&minus;</button><span aria-label="Quantity">' + q + '</span><button type="button" data-a="inc" data-id="' + id + '" aria-label="More ' + esc(m.name) + '">+</button></div>' +
      '<div style="text-align:right"><button class="rm" type="button" data-a="rm" data-id="' + id + '">Remove</button></div></div>';
  }).join('');
}
$('cartList').addEventListener('click', function(e){
  var b = e.target.closest('button[data-a]'); if(!b) return;
  var id = b.dataset.id, a = b.dataset.a;
  if(a === 'inc') cart[id] = Math.min(cart[id] + 1, 20);
  if(a === 'dec'){ cart[id]--; if(cart[id] <= 0) delete cart[id]; }
  if(a === 'rm') delete cart[id];
  save('qo_cart', cart); drawCart();
});
$('clearCart').addEventListener('click', function(){ cart = {}; save('qo_cart', cart); drawCart(); $('err').textContent = ''; });

// ---- Form ----
$('otype').addEventListener('change', function(){ $('addrBox').hidden = this.value !== 'Delivery'; });

$('orderForm').addEventListener('submit', function(e){
  e.preventDefault();
  var name = $('cname').value.trim(), type = $('otype').value, addr = $('addr').value.trim(), err = $('err');
  if(!Object.keys(cart).length){ err.textContent = 'Your cart is empty.'; return; }
  if(!name){ err.textContent = 'Please enter your name.'; $('cname').focus(); return; }
  if(type === 'Delivery' && !addr){ err.textContent = 'Please enter a delivery address.'; $('addr').focus(); return; }
  err.textContent = '';

  var next = (load('qo_next', 1001));
  var order = {
    no: 'ORD-' + next,
    time: new Date().toISOString(),
    name: name, type: type, pay: $('pay').value, addr: type === 'Delivery' ? addr : '',
    note: $('note').value.trim(),
    status: 'Pending',
    items: Object.keys(cart).map(function(id){ var m = find(+id); return {name: m.name, price: m.price, qty: cart[id]}; })
  };
  order.total = order.items.reduce(function(s, i){ return s + i.price * i.qty; }, 0);

  orders.unshift(order);
  if(!save('qo_orders', orders)){ orders.shift(); err.textContent = 'Could not save the order in this browser.'; return; }
  save('qo_next', next + 1);
  showReceipt(order);
  cart = {}; save('qo_cart', cart); drawCart(); drawHistory();
  $('note').value = '';
});

function showReceipt(o){
  $('receipt').innerHTML = '<div class="receipt"><p class="ok">Order placed!</p><h3>' + esc(o.no) + '</h3>' +
    '<div class="note">' + esc(o.name) + ' &middot; ' + esc(o.type) + ' &middot; ' + esc(o.pay) + (o.addr ? '<br>' + esc(o.addr) : '') + '</div>' +
    '<table>' + o.items.map(function(i){ return '<tr><td>' + i.qty + ' &times; ' + esc(i.name) + '</td><td>' + money(i.price * i.qty) + '</td></tr>'; }).join('') +
    '<tr><td><b>Total</b></td><td><b>' + money(o.total) + '</b></td></tr></table>' +
    (o.note ? '<div class="note">Note: ' + esc(o.note) + '</div>' : '') +
    '<div class="row" style="margin-top:10px"><button class="ghost" type="button" onclick="window.print()">Print receipt</button></div></div>';
  $('receipt').scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ---- Order history ----
function drawHistory(){
  if(!orders.length){ $('history').innerHTML = '<p class="empty">No orders yet.</p>'; $('clearAll').disabled = true; return; }
  $('clearAll').disabled = false;
  $('history').innerHTML = '<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
    orders.map(function(o, i){
      var d = new Date(o.time).toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'});
      var opts = STATUSES.map(function(s){ return '<option' + (s === o.status ? ' selected' : '') + '>' + s + '</option>'; }).join('');
      return '<tr><td><b>' + esc(o.no) + '</b><br><span class="note">' + esc(d) + '</span></td><td>' + esc(o.name) + '<br><span class="note">' + esc(o.type) + ' &middot; ' + esc(o.pay) + '</span></td>' +
        '<td>' + o.items.map(function(x){ return x.qty + ' &times; ' + esc(x.name); }).join('<br>') + '</td><td>' + money(o.total) + '</td>' +
        '<td><select data-i="' + i + '" aria-label="Status of ' + esc(o.no) + '">' + opts + '</select></td></tr>';
    }).join('') + '</tbody></table>';
}
$('history').addEventListener('change', function(e){
  var s = e.target.closest('select[data-i]'); if(!s) return;
  orders[+s.dataset.i].status = s.value; save('qo_orders', orders); say('Status updated');
});
$('clearAll').addEventListener('click', function(){
  if(confirm('Delete all saved orders?')){ orders = []; save('qo_orders', orders); drawHistory(); $('receipt').innerHTML = ''; say('Orders deleted'); }
});

drawTabs(); drawMenu(); drawCart(); drawHistory();
})();
</script>
</body>
</html>
